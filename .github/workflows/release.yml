name: Release verified Windows app

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Validate exact version tag
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") { throw 'RELEASE_TAG_VERSION_MISMATCH' }
          $target = git rev-parse "$env:GITHUB_REF^{commit}"
          if ($target -ne $env:GITHUB_SHA) { throw 'RELEASE_TAG_EVENT_SHA_MISMATCH' }
      - name: Pin npm and verify Node toolchain
        run: |
          npm install --global npm@11.12.1
          npm run verify:toolchain
      - name: Install fresh Node ABI dependencies
        run: npm ci
      - name: Install user guide test dependency
        run: python -m pip install python-docx==1.2.0
      - name: Run ordinary Node validation
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:SystemDrive "hitmuse-tests-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $testTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          $env:PYTHONUTF8 = '1'
          npm test -- --exclude tests/services/model-source-packaged.integration.test.ts --maxWorkers 2
          npm run typecheck
      - name: Run disjoint public candidate and Gitleaks gates
        shell: pwsh
        run: |
          $auditRoot = Join-Path $env:RUNNER_TEMP 'hitmuse-public-audit'
          $candidateRoot = Join-Path $auditRoot 'candidate'
          $repositoryRoot = $env:GITHUB_WORKSPACE
          $releaseRoot = Join-Path $auditRoot 'release'
          $reportRoot = Join-Path $auditRoot 'report'
          $toolRoot = Join-Path $auditRoot 'tools'
          New-Item -ItemType Directory -Path $candidateRoot, $releaseRoot, $reportRoot -ErrorAction Stop | Out-Null
          git archive --format=tar HEAD | tar -xf - -C $candidateRoot
          node scripts/verify-public-candidate.mjs --candidate $candidateRoot
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/scan-public-secrets.ps1 -CandidateRoot $candidateRoot -RepositoryRoot $repositoryRoot -ReleaseRoot $releaseRoot -ReportRoot $reportRoot -ToolRoot $toolRoot
          $scannerExit = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorActionPreference
          if ($scannerExit -ne 0) {
            Get-Content (Join-Path $reportRoot 'public-secret-scan-summary.json') -Raw
            exit $scannerExit
          }
      - name: Validate reviewed visual evidence source
        env:
          HITMUSE_REVIEWED_VISUAL_EVIDENCE: ${{ vars.HITMUSE_REVIEWED_VISUAL_EVIDENCE }}
        shell: pwsh
        run: |
          $reviewBytes = [Text.Encoding]::UTF8.GetBytes($env:HITMUSE_REVIEWED_VISUAL_EVIDENCE)
          if ($reviewBytes.Length -eq 0 -or $reviewBytes.Length -gt 1048576) {
            throw 'VISUAL_PRIVACY_REVIEW_REQUIRED: provide the human-reviewed evidence source before tagging.'
          }
          $reviewRoot = Join-Path $env:RUNNER_TEMP 'reviewed-visual-evidence'
          $reviewPath = Join-Path $reviewRoot 'review.json'
          $bindingPath = Join-Path $env:RUNNER_TEMP 'reviewed-visual-evidence-binding.json'
          New-Item -ItemType Directory -Path $reviewRoot -ErrorAction Stop | Out-Null
          $stream = [System.IO.File]::Open($reviewPath, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try { $stream.Write($reviewBytes, 0, $reviewBytes.Length) } finally { $stream.Dispose() }
          node scripts/verify-visual-privacy-review.mjs --read-binding --review $reviewPath --review-root $reviewRoot --binding-output $bindingPath

  engine:
    needs: validate
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - name: Verify pinned engine toolchain
        run: npm run verify:toolchain
      - name: Install fresh Node ABI dependencies
        run: npm ci
      - name: Set up isolated Scrapling environment
        run: npm run setup:scrapling-dev
      - name: Run Scrapling protocol tests
        working-directory: engine/scrapling
        run: ./.venv/Scripts/python.exe -m unittest discover -s tests
      - name: Build deterministic Scrapling engine
        run: npm run build:scrapling
      - name: Verify generated Scrapling engine
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          node --input-type=module --eval "import { verifyGeneratedScraplingResource } from './scripts/build-scrapling-engine.mjs'; await verifyGeneratedScraplingResource({ rootDirectory: process.cwd(), sourceCommit: '$commit' })"
      - name: Upload generated engine transport artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: scrapling-engine
          path: .build-resources/scrapling-engine
          if-no-files-found: error

  package:
    needs: [validate, engine]
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Pin npm and verify toolchain
        run: |
          npm install --global npm@11.12.1
          npm run verify:toolchain
      - name: Install Electron ABI dependencies
        env:
          HITMUSE_INSTALL_RUNTIME: electron
        run: npm ci
      - name: Download engine transport artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scrapling-engine
          path: .build-resources/scrapling-engine
      - name: Prepare immutable resources
        run: |
          npm run prepare:model
          npm run verify:resources
          npm run verify:release-dependencies
      - name: Build guide and installer without publication
        run: |
          python -m pip install python-docx==1.2.0
          python scripts/build-user-guide.py --output-directory release/guides
          npm run package:installer
      - name: Run packaged offline and smoke gates
        shell: pwsh
        run: |
          npm test -- tests/services/model-source-packaged.integration.test.ts tests/release/offline-model-package.test.ts
          $smokeRoot = Join-Path $env:RUNNER_TEMP "smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $userData = Join-Path $smokeRoot 'user-data'
          $denyHosts = Join-Path $smokeRoot 'deny-hosts.json'
          New-Item -ItemType Directory -Path $smokeRoot -ErrorAction Stop | Out-Null
          [ordered]@{ schemaVersion = 1; hosts = @('github.com', 'api.github.com', 'objects.githubusercontent.com', 'release-assets.githubusercontent.com', 'huggingface.co', 'cdn-lfs.huggingface.co', 'cas-bridge.xethub.hf.co', 'api.hitmuse.com', 'hitmuse-beta-d8gbn7x2o2d6b8c2c-1463630014.ap-shanghai.app.tcloudbase.com') } | ConvertTo-Json -Compress | Set-Content -LiteralPath $denyHosts -Encoding utf8 -NoNewline
          npm run verify:packaged-app -- --smoke-user-data-dir $userData --smoke-deny-hosts-file $denyHosts --smoke-test-root $env:RUNNER_TEMP
      - name: Generate public evidence
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'release-evidence-source'
          $evidence = Join-Path $env:RUNNER_TEMP 'release-evidence'
          $version = node -p "require('./package.json').version"
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $installerName = "HitMuse-$version-$shortSha-setup.exe"
          New-Item -ItemType Directory -Path $source -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $source 'docs'), (Join-Path $source 'guides') | Out-Null
          Copy-Item "release/competitor-content-radar-setup-$version.exe" (Join-Path $source $installerName)
          Copy-Item "release/competitor-content-radar-setup-$version.exe.blockmap" (Join-Path $source "$installerName.blockmap")
          Copy-Item release/latest.yml (Join-Path $source 'latest.yml')
          Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $source 'THIRD_PARTY_NOTICES.md')
          Copy-Item docs/resources-and-licenses.md (Join-Path $source 'docs/resources-and-licenses.md')
          Copy-Item .build-resources/scrapling-engine/engine-manifest.json (Join-Path $source 'engine-manifest.json')
          Copy-Item .build-resources/scrapling-engine/engine-provenance.json (Join-Path $source 'engine-provenance.json')
          Copy-Item release/guides/competitor-content-radar-user-guide.md (Join-Path $source 'guides/competitor-content-radar-user-guide.md')
          Copy-Item release/guides/competitor-content-radar-user-guide.docx (Join-Path $source 'guides/competitor-content-radar-user-guide.docx')
          node scripts/generate-release-evidence.mjs $source $evidence $env:GITHUB_SHA $version
      - name: Verify same-commit human-reviewed visual evidence
        env:
          HITMUSE_REVIEWED_VISUAL_EVIDENCE: ${{ vars.HITMUSE_REVIEWED_VISUAL_EVIDENCE }}
        shell: pwsh
        run: |
          $reviewBytes = [Text.Encoding]::UTF8.GetBytes($env:HITMUSE_REVIEWED_VISUAL_EVIDENCE)
          if ($reviewBytes.Length -eq 0 -or $reviewBytes.Length -gt 1048576) { throw 'VISUAL_PRIVACY_REVIEW_REQUIRED' }
          $candidate = Join-Path $env:RUNNER_TEMP 'visual-public-candidate'
          $reviewRoot = Join-Path $env:RUNNER_TEMP 'reviewed-visual-evidence'
          $reviewPath = Join-Path $reviewRoot 'review.json'
          $visualReportRoot = Join-Path $env:RUNNER_TEMP 'visual-privacy-report'
          $report = Join-Path $visualReportRoot 'visual-privacy.json'
          New-Item -ItemType Directory -Path $candidate, $reviewRoot, $visualReportRoot -ErrorAction Stop | Out-Null
          git archive --format=tar HEAD | tar -xf - -C $candidate
          $stream = [System.IO.File]::Open($reviewPath, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try { $stream.Write($reviewBytes, 0, $reviewBytes.Length) } finally { $stream.Dispose() }
          node scripts/build-visual-privacy-manifest.mjs --candidate-root $candidate --release-root (Join-Path $env:RUNNER_TEMP 'release-evidence-source') --report-path $report
          node scripts/verify-visual-privacy-review.mjs --manifest $report --review $reviewPath --review-root $reviewRoot --commit $env:GITHUB_SHA
      - name: Upload verified release evidence transport artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: verified-release-evidence
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error

  publish:
    needs: [validate, engine, package]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Download verified release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-evidence
          path: ${{ runner.temp }}/release-evidence
      - name: Publish verified draft Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: node scripts/publish-github-release.mjs --repository "${{ github.repository }}" --tag "$env:GITHUB_REF_NAME" --commit "$env:GITHUB_SHA" --assets-manifest "$env:RUNNER_TEMP/release-evidence/assets-manifest.json" --evidence-dir "$env:RUNNER_TEMP/release-evidence"
