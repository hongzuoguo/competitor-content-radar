name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - name: Verify build toolchain
        run: npm run verify:toolchain
      - name: Install Node ABI dependencies
        run: npm ci
      - name: Run ordinary Node tests
        run: npm test -- --exclude tests/services/model-source-packaged.integration.test.ts
      - name: Type check
        run: npm run typecheck
      - name: Run disjoint public candidate and Gitleaks gates
        shell: pwsh
        run: |
          $auditRoot = Join-Path $env:RUNNER_TEMP 'hitmuse-public-audit'
          $candidateRoot = Join-Path $auditRoot 'candidate'
          $repositoryRoot = $env:GITHUB_WORKSPACE
          $releaseRoot = Join-Path $auditRoot 'release'
          $reportRoot = Join-Path $auditRoot 'report'
          $toolRoot = Join-Path $auditRoot 'tools'
          New-Item -ItemType Directory -Path $candidateRoot, $releaseRoot, $reportRoot -ErrorAction Stop | Out-Null
          git archive --format=tar HEAD | tar -xf - -C $candidateRoot
          node scripts/verify-public-candidate.mjs --candidate $candidateRoot
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/scan-public-secrets.ps1 -CandidateRoot $candidateRoot -RepositoryRoot $repositoryRoot -ReleaseRoot $releaseRoot -ReportRoot $reportRoot -ToolRoot $toolRoot
      - name: Build renderer without publication
        run: npm run build
      - name: Verify packaging commands cannot publish
        shell: pwsh
        run: |
          node --input-type=module --eval "import packageJson from './package.json' with { type: 'json' }; if (!['package:dir', 'package:installer', 'dist', 'dist:dir'].every((name) => packageJson.scripts[name].includes('--publish never'))) throw new Error('PACKAGE_PUBLICATION_GUARD_INVALID')"

  engine:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - name: Verify pinned Python toolchain and lock
        run: npm run verify:toolchain
      - name: Install fresh Node ABI dependencies
        run: npm ci
      - name: Set up isolated Scrapling environment
        run: npm run setup:scrapling-dev
      - name: Run Scrapling protocol tests
        run: engine/scrapling/.venv/Scripts/python.exe -m unittest discover -s engine/scrapling/tests
      - name: Build deterministic Scrapling engine
        run: npm run build:scrapling
      - name: Verify generated Scrapling engine
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          node --input-type=module --eval "import { verifyGeneratedScraplingResource } from './scripts/build-scrapling-engine.mjs'; await verifyGeneratedScraplingResource({ rootDirectory: process.cwd(), sourceCommit: '$commit' })"
